          {% endfor %}

- name: Build a combined CSV report across all devices
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    run_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    report_hosts: "{{ (groups['cisco_switches'] | default([])) + (groups['aruba_switches'] | default([])) }}"
  tasks:
    - name: Ensure output directory exists
      ansible.builtin.file:
        path: output
        state: directory
        mode: "0755"

    - name: Write combined CSV report
      ansible.builtin.copy:
        dest: "output/switch_report_{{ run_timestamp }}.csv"
        content: |
          device,host,command,timestamp,output
          {% for h in report_hosts %}
          {% for idx in range(commands | length) %}
          {{ h }},{{ hostvars[h].ansible_host }},"{{ commands[idx] }}",{{ run_timestamp }},"{{ hostvars[h].cmd_result.stdout[idx] | replace('"','""') }}"
          {% endfor %}
          {% endfor %}