# playbook.yml
#
# Runs the commands listed in commands.yml against every device in
# inventory.yml, then saves each device's output to a timestamped
# .txt file under ./output/ on this machine.
#
# USAGE (see README.md for full setup):
#   ansible-playbook -i inventory.yml playbook.yml -e @commands.yml --ask-vault-pass
#
#   Only one device:
#   ansible-playbook -i inventory.yml playbook.yml -e @commands.yml --ask-vault-pass --limit core-switch-01

- name: Run commands on Cisco IOS switches
  hosts: cisco_switches
  gather_facts: false
  vars:
    run_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
  tasks:
    - name: Ensure output directory exists
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: output
        state: directory
        mode: "0755"

    - name: Run each command
      cisco.ios.ios_command:
        commands: "{{ commands }}"
      register: cmd_result

    - name: Save output to a local file
      delegate_to: localhost
      ansible.builtin.copy:
        dest: "output/{{ inventory_hostname }}_{{ run_timestamp }}.txt"
        content: |
          === {{ inventory_hostname }} ({{ ansible_host }}) ===
          {% for cmd in commands %}

          --- {{ cmd }} ---
          {{ cmd_result.stdout[loop.index0] }}
          {% endfor %}

- name: Run commands on Aruba (ArubaOS-Switch) devices
  hosts: aruba_switches
  gather_facts: false
  vars:
    run_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
